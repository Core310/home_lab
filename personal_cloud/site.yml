---
- name: GSD Personal Cloud Stack Deployment (Vaultwarden, Immich, Gitea)
  hosts: all
  become: yes
  vars:
    target_user: "{{ lookup('env', 'SUDO_USER') if (lookup('env', 'SUDO_USER') != '' and lookup('env', 'SUDO_USER') != 'root') else lookup('env', 'USER') }}"
    user_home: "{{ '/home/' + target_user if target_user != 'root' else '/root' }}"
    photos_base: "{{ photos_dir | default((user_home + '/D/photos') if ((user_home + '/D') is directory) else (user_home + '/photos')) }}"
    target_puid: "{{ puid | default('1000') }}"
    target_pgid: "{{ pgid | default('1000') }}"

  tasks:
    - name: Ensure Docker and Docker Compose plugin are installed
      apt:
        name:
          - docker-ce
          - docker-compose-plugin
        state: present

    - name: Create Immich photo upload directory on D drive
      file:
        path: "{{ photos_base }}"
        state: directory
        mode: '0775'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"

    - name: Create personal cloud data directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0775'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"
      loop:
        - "{{ playbook_dir }}/data/vaultwarden"
        - "{{ playbook_dir }}/data/immich/db"
        - "{{ playbook_dir }}/data/immich/model-cache"
        - "{{ playbook_dir }}/data/gitea"

    - name: Generate .env file for Personal Cloud Compose
      copy:
        dest: "{{ playbook_dir }}/.env"
        content: |
          PHOTOS_DIR={{ photos_base }}
          PUID={{ target_puid }}
          PGID={{ target_pgid }}
          IMMICH_DB_PASS=immich_gsd_secure_pgpass
        mode: '0600'

    - name: Copy docker-compose.yml into stack directory
      copy:
        src: files/docker-compose.yml
        dest: "{{ playbook_dir }}/docker-compose.yml"

    - name: Spin up the Personal Cloud stack
      command: docker compose up -d
      args:
        chdir: "{{ playbook_dir }}"
