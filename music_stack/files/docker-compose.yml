version: '3.8'

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Chicago}
    volumes:
      - ./config/lidarr:/config
      # We mount MEDIA_DIR so Lidarr can see both downloads and music
      - ${MEDIA_DIR:-/opt/media}:/media
    ports:
      - 9101:8686
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - 9100:80
    volumes:
      - ${MEDIA_DIR:-/opt/media}:/srv
      - ./config/filebrowser:/home/filebrowser/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Chicago}
      - FILEBROWSER_ADMIN_USER=admin
      - FILEBROWSER_ADMIN_PASSWORD=adminadmin123

  dufs:
    image: sigoden/dufs:latest
    container_name: dufs
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${MEDIA_DIR:-/opt/media}:/data
    # -A enables all operations (upload/delete/etc), which is needed for WebDAV clients
    command: /data -A
    ports:
      - 9102:5000
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
    volumes:
      - ./config/navidrome:/data
      - ${MEDIA_DIR:-/opt/media}/music:/music:ro
    ports:
      - 9103:4533
    restart: unless-stopped

  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - DOWNLOAD_DIR=/downloads
      - AUDIO_DOWNLOAD_DIR=/downloads
      - DEFAULT_OPTION=bestaudio
      - OUTPUT_TEMPLATE=%(artist,uploader)s - %(playlist_title,album)s/%(playlist_index&{:02d} - |)s%(title)s.%(ext)s
      - OUTPUT_TEMPLATE_PLAYLIST=%(playlist_title,album)s/%(playlist_index&{:02d} - |)s%(title)s.%(ext)s
    volumes:
      - ${MEDIA_DIR:-/opt/media}/music:/downloads
    ports:
      - 9104:8081
    restart: unless-stopped
