---
- name: GSD Music and Management Stack Deployment
  hosts: all
  become: yes
  vars:
    target_user: "{{ lookup('env', 'SUDO_USER') if (lookup('env', 'SUDO_USER') != '' and lookup('env', 'SUDO_USER') != 'root') else lookup('env', 'USER') }}"
    user_home: "{{ '/home/' + target_user if target_user != 'root' else '/root' }}"
    media_base: "{{ media_dir | default((user_home + '/D/media') if ((user_home + '/D') is directory) else (user_home + '/media')) }}"
    target_puid: "{{ puid | default('1000') }}"
    target_pgid: "{{ pgid | default('1000') }}"
    target_tz: "{{ timezone | default('America/Chicago') }}"

  tasks:
    - name: Ensure Docker and Docker Compose plugin are installed
      apt:
        name:
          - docker-ce
          - docker-compose-plugin
        state: present

    - name: Create music directory
      file:
        path: "{{ media_base }}/music"
        state: directory
        mode: '0775'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"

    - name: Create config directory for filebrowser database
      file:
        path: "{{ playbook_dir }}/config/filebrowser"
        state: directory
        mode: '0775'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"

    - name: Ensure FileBrowser Quantum config.yaml exists
      copy:
        src: files/filebrowser_config.yaml
        dest: "{{ playbook_dir }}/config/filebrowser/config.yaml"
        mode: '0644'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"
        force: no

    - name: Generate .env file for Docker Compose
      copy:
        dest: "{{ playbook_dir }}/.env"
        content: |
          MEDIA_DIR={{ media_base }}
          PUID={{ target_puid }}
          PGID={{ target_pgid }}
          TZ={{ target_tz }}
        mode: '0644'

    - name: Copy docker-compose.yml into stack directory
      copy:
        src: files/docker-compose.yml
        dest: "{{ playbook_dir }}/docker-compose.yml"

    - name: Spin up the Music and Management stack
      command: docker compose up -d
      args:
        chdir: "{{ playbook_dir }}"
