services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9201:9443"
      - "9200:9000"
    volumes:
      # Map the standard docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "9202:8090"
    volumes:
      - beszel_data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      - KEY=${BESZEL_KEY:-ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC/fTQojpiB3+XlJbmbI3/RYbLXoNr+n06ph9hacXC5z}
      - PORT=45876
    volumes:
      # Map the standard docker socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

  bentopdf:
    image: bentopdf/bentopdf:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - "9203:8080"

  vert:
    image: vert-sh/vert
    container_name: vert
    restart: unless-stopped
    ports:
      - "9204:80"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Chicago
      - DOCKER_API_VERSION=1.45
      # Runs every Sunday at 02:00 AM (3 hours before 05:00 reboot)
      - WATCHTOWER_SCHEDULE=0 0 2 * * 0
      # Auto-remove old images to save disk space
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false

volumes:
  portainer_data:
  beszel_data:
