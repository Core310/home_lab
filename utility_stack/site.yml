---
- name: GSD Utility Stack Deployment (Migrated to Podman)
  hosts: homelab_server
  become: yes
  tasks:
    - name: Ensure Podman, Podman Compose, and Git are installed
      apt:
        name:
          - podman
          - podman-compose
          - git
        state: present
        update_cache: yes

    - name: Enable the Podman socket for Docker compatibility (needed for Portainer/Beszel)
      systemd:
        name: podman.socket
        state: started
        enabled: yes

    - name: Create Utility application deployment directory
      file:
        path: /opt/utility_stack
        state: directory

    - name: Clone VERT repository for building
      git:
        repo: https://github.com/VERT-sh/VERT
        dest: /opt/utility_stack/VERT_src
        version: main
        depth: 1

    - name: Build VERT Podman image from source
      command: >
        podman build -t vert-sh/vert 
        --build-arg PUB_ENV=production 
        --build-arg PUB_HOSTNAME=vert.sh 
        --build-arg PUB_PLAUSIBLE_URL=https://plausible.example.com 
        --build-arg PUB_VERTD_URL=https://vertd.vert.sh 
        --build-arg PUB_DONATION_URL=https://donations.vert.sh 
        --build-arg PUB_DISABLE_ALL_EXTERNAL_REQUESTS=false 
        --build-arg PUB_STRIPE_KEY="" .
      args:
        chdir: /opt/utility_stack/VERT_src

    - name: Copy docker-compose.yml to the host
      copy:
        src: files/docker-compose.yml
        dest: /opt/utility_stack/docker-compose.yml

    - name: Spin up the Utility stack
      command: podman-compose up -d
      args:
        chdir: /opt/utility_stack
