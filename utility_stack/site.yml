---
- name: GSD Utility Stack Deployment (Docker)
  hosts: all
  become: yes
  tasks:
    - name: Ensure Docker, Docker Compose plugin, and Git are installed
      apt:
        name:
          - docker-ce
          - docker-compose-plugin
          - git
        state: present

    - name: Clone VERT repository for building
      git:
        repo: https://github.com/VERT-sh/VERT
        dest: "{{ playbook_dir }}/VERT_src"
        version: main
        depth: 1
        force: yes

    - name: Patch svelte-stripe version in VERT for Svelte 5 build compatibility
      replace:
        path: "{{ playbook_dir }}/VERT_src/package.json"
        regexp: '"svelte-stripe":\s*"[^"]+"'
        replace: '"svelte-stripe": "^2.0.0"'

    - name: Ensure VERT Dockerfile copies bun.lock for reproducible builds
      replace:
        path: "{{ playbook_dir }}/VERT_src/Dockerfile"
        regexp: 'COPY package\.json \./'
        replace: 'COPY package.json bun.lock* ./'

    - name: Build VERT Docker image from source
      command: >
        docker build -t vert-sh/vert 
        --build-arg PUB_ENV=production 
        --build-arg PUB_HOSTNAME=vert.sh 
        --build-arg PUB_PLAUSIBLE_URL=https://plausible.example.com 
        --build-arg PUB_VERTD_URL=https://vertd.vert.sh 
        --build-arg PUB_DONATION_URL=https://donations.vert.sh 
        --build-arg PUB_DISABLE_ALL_EXTERNAL_REQUESTS=false 
        --build-arg PUB_STRIPE_KEY="" .
      args:
        chdir: "{{ playbook_dir }}/VERT_src"

    - name: Copy docker-compose.yml into stack directory
      copy:
        src: files/docker-compose.yml
        dest: "{{ playbook_dir }}/docker-compose.yml"

    - name: Spin up the Utility stack
      command: docker compose up -d
      args:
        chdir: "{{ playbook_dir }}"
