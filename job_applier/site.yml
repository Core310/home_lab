---
- name: GSD ApplyPilot Automated Job Application Pipeline Deployment
  hosts: all
  become: yes
  vars:
    target_user: "{{ lookup('env', 'SUDO_USER') if (lookup('env', 'SUDO_USER') != '' and lookup('env', 'SUDO_USER') != 'root') else lookup('env', 'USER') }}"
    user_home: "{{ '/home/' + target_user if target_user != 'root' else '/root' }}"
    app_dir: "{{ playbook_dir }}/app"
    target_puid: "{{ puid | default('1000') }}"
    target_pgid: "{{ pgid | default('1000') }}"
    repo_url: "https://github.com/ibarrajo/ApplyPilot.git"

  tasks:
    - name: Ensure required system packages and headless browser libraries are installed
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - git
          - curl
          - libgbm1
          - libnss3
          - libasound2t64
          - libatk-bridge2.0-0t64
          - libgtk-3-0t64
          - libx11-xcb1
        state: present
        update_cache: yes
      ignore_errors: yes

    - name: Create ApplyPilot application directories on D drive
      file:
        path: "{{ item }}"
        state: directory
        mode: '0775'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/logs"
        - "{{ app_dir }}/screenshots"
        - "{{ app_dir }}/data"

    - name: Clone ApplyPilot repository into app/repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}/repo"
        version: main
        force: no
      become_user: "{{ target_user }}"
      ignore_errors: yes

    - name: Create Python virtual environment
      command: "python3 -m venv {{ app_dir }}/.venv"
      args:
        creates: "{{ app_dir }}/.venv/bin/activate"
      become_user: "{{ target_user }}"

    - name: Upgrade pip and install core automation dependencies in virtualenv
      command: "{{ app_dir }}/.venv/bin/pip install --upgrade pip wheel setuptools pyyaml pandas requests python-dotenv playwright"
      become_user: "{{ target_user }}"

    - name: Install requirements from cloned repo if present
      command: "{{ app_dir }}/.venv/bin/pip install -r {{ app_dir }}/repo/requirements.txt"
      args:
        chdir: "{{ app_dir }}/repo"
      become_user: "{{ target_user }}"
      ignore_errors: yes

    - name: Install Playwright Chromium browser binary
      command: "{{ app_dir }}/.venv/bin/playwright install chromium"
      become_user: "{{ target_user }}"
      ignore_errors: yes

    - name: Deploy Python CSV batch orchestrator script
      copy:
        src: files/applypilot_runner.py
        dest: "{{ app_dir }}/applypilot_runner.py"
        mode: '0755'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"

    - name: Deploy Plain Text Resume configuration
      copy:
        src: files/plain_text_resume.yaml
        dest: "{{ app_dir }}/plain_text_resume.yaml"
        mode: '0644'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"

    - name: Deploy ApplyPilot configuration
      copy:
        src: files/config.yaml
        dest: "{{ app_dir }}/config.yaml"
        mode: '0644'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"

    - name: Deploy initial jobs.csv tracking sheet (do not overwrite existing)
      copy:
        src: files/jobs.csv
        dest: "{{ app_dir }}/jobs.csv"
        mode: '0664'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"
        force: no

    - name: Deploy .env.example template
      copy:
        src: files/.env.example
        dest: "{{ app_dir }}/.env.example"
        mode: '0644'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"

    - name: Generate default .env if not existing
      copy:
        src: files/.env.example
        dest: "{{ app_dir }}/.env"
        mode: '0600'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"
        force: no

    - name: Create 1-click batch runner helper script
      copy:
        dest: "{{ app_dir }}/run_batch.sh"
        content: |
          #!/usr/bin/env bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"
          source .venv/bin/activate
          python3 applypilot_runner.py "$@"
        mode: '0755'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"

    - name: Ensure correct ownership across entire app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        recurse: yes
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"
