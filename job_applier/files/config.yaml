---
# ==============================================================================
# ApplyPilot Automation Engine Configuration
# ==============================================================================

app:
  name: "ApplyPilot"
  version: "1.0.0"
  log_level: "INFO"
  screenshots_enabled: true
  screenshots_dir: "screenshots"

llm:
  # Multi-Provider Routing: anthropic, openai, gemini, or ollama
  default_provider: "anthropic"
  anthropic:
    model: "claude-3-5-sonnet-20241022"
    fallback_model: "claude-3-5-haiku-20241022"
    temperature: 0.2
    max_tokens: 4096
  openai:
    model: "gpt-4o"
    temperature: 0.2
  gemini:
    model: "gemini-1.5-pro"
    temperature: 0.2

browser:
  headless: true
  slow_mo_ms: 100
  timeout_seconds: 45
  viewport:
    width: 1920
    height: 1080
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

ats_settings:
  workday:
    auto_create_account: true
    default_password_env: "WORKDAY_PASSWORD"
    timeout_seconds: 60
    auto_fetch_email_otp: true
    sync_to_vaultwarden: true
  greenhouse:
    auto_fill_demographics: true
  lever:
    auto_upload_resume: true

integrations:
  email_otp_listener:
    enabled: true
    sender_keyword: "myworkdayjobs"
    poll_timeout_seconds: 60
    poll_interval_seconds: 4
  vaultwarden_sync:
    enabled: true
    save_local_audit_cache: true

batch_runner:
  csv_file: "jobs.csv"
  resume_file: "plain_text_resume.yaml"
  delay_between_applications_sec: 5
  max_retries_per_job: 2
