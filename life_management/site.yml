---
- name: GSD Life Management Stack Deployment (Mealie, LubeLogger, Christmas Community, Speedtest)
  hosts: all
  become: yes
  vars:
    target_user: "{{ lookup('env', 'SUDO_USER') if (lookup('env', 'SUDO_USER') != '' and lookup('env', 'SUDO_USER') != 'root') else lookup('env', 'USER') }}"
    user_home: "{{ '/home/' + target_user if target_user != 'root' else '/root' }}"
    target_puid: "{{ puid | default('1000') }}"
    target_pgid: "{{ pgid | default('1000') }}"
    target_tz: "{{ timezone | default('America/Chicago') }}"

  tasks:
    - name: Ensure Docker and Docker Compose plugin are installed
      apt:
        name:
          - docker-ce
          - docker-compose-plugin
        state: present

    - name: Create life management data directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0775'
        owner: "{{ target_puid }}"
        group: "{{ target_pgid }}"
      loop:
        - "{{ playbook_dir }}/data/mealie"
        - "{{ playbook_dir }}/data/lubelogger/data"
        - "{{ playbook_dir }}/data/lubelogger/config"
        - "{{ playbook_dir }}/data/lubelogger/documents"
        - "{{ playbook_dir }}/data/lubelogger/images"
        - "{{ playbook_dir }}/data/lubelogger/temp"
        - "{{ playbook_dir }}/data/lubelogger/log"
        - "{{ playbook_dir }}/data/christmas_community"
        - "{{ playbook_dir }}/data/speedtest_tracker"

    - name: Generate .env file for Life Management Compose
      copy:
        dest: "{{ playbook_dir }}/.env"
        content: |
          PUID={{ target_puid }}
          PGID={{ target_pgid }}
          TZ={{ target_tz }}
          SPEEDTEST_APP_KEY=base64:qKIdfI8rgZSxpwqVvRdf3RgW1S7y7qZvNg1NrfrRyBQ=
        mode: '0644'

    - name: Copy docker-compose.yml into stack directory
      copy:
        src: files/docker-compose.yml
        dest: "{{ playbook_dir }}/docker-compose.yml"

    - name: Spin up the Life Management stack
      command: docker compose up -d
      args:
        chdir: "{{ playbook_dir }}"
